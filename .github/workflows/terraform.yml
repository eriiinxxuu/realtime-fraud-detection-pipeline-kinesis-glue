name: Terraform

on:
  push:
    branches: [master]
    paths:
      - 'terraform/modules/**'
  pull_request:
    branches: [master]
    paths:
      - 'terraform/modules/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=ap-southeast-2"

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_aws_account_id:          ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_tf_state_bucket:         ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_redshift_admin_password: ${{ secrets.REDSHIFT_ADMIN_PASSWORD }}
          TF_VAR_github_org:              ${{ github.repository_owner }}
          TF_VAR_github_repo:             ${{ github.event.repository.name }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_account_id:          ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_tf_state_bucket:         ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_redshift_admin_password: ${{ secrets.REDSHIFT_ADMIN_PASSWORD }}
          TF_VAR_github_org:              ${{ github.repository_owner }}
          TF_VAR_github_repo:             ${{ github.event.repository.name }}