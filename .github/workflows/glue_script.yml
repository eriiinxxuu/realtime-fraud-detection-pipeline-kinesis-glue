name: Deploy Glue Script

on:
  push:
    branches: [main]
    paths:
      - 'terraform/modules/glue/streaming_job.py'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-glue-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload Glue script to S3
        run: |
          aws s3 cp terraform/modules/glue/streaming_job.py \
            s3://${{ secrets.GLUE_ASSETS_BUCKET }}/streaming_job.py

      - name: Restart Glue job (if running)
        run: |
          JOB_NAME="${{ secrets.PROJECT_NAME }}-streaming-features"
          
          # check if job is currently running
          RUN_ID=$(aws glue get-job-runs \
            --job-name "$JOB_NAME" \
            --max-results 1 \
            --query 'JobRuns[?JobRunState==`RUNNING`].Id' \
            --output text)
          
          if [ -n "$RUN_ID" ]; then
            echo "Stopping running job: $RUN_ID"
            aws glue batch-stop-job-run \
              --job-name "$JOB_NAME" \
              --job-run-ids "$RUN_ID"
            echo "Waiting for job to stop..."
            sleep 30
          fi
          
          echo "Starting Glue job with updated script..."
          aws glue start-job-run --job-name "$JOB_NAME"
          echo "Glue job started."
